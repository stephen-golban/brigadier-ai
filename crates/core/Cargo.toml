[package]
name = "brigadier-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
claude-wire = { path = "../claude-wire" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# `killpg` on a process group, without `unsafe`: this crate is `#![deny(unsafe_code)]` and
# `libc::killpg` is an unsafe extern fn. 0.31.3 is the current release on crates.io (2026-09-02);
# `signal` is the feature that gates `nix::sys::signal::killpg`.
# see docs/research/tauri-runtime.md §5 — killing the direct child leaves the CLI's own
# grandchildren (tool subprocesses) alive, so the session gets its own process group.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal"] }

[dev-dependencies]
# `full` does not include `test-util`; the approval-park timeout tests need `tokio::time::pause`.
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
# Scratch repos for the worktree tests; 3.27.0 is the current release on crates.io (2026-09-02).
tempfile = "3.27"
