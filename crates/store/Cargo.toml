[package]
name = "brigadier-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
brigadier-core = { path = "../core" }
# see docs/research/persistence.md §2 — rusqlite + `bundled` over sqlx: newest bundled SQLite
# (3.53.2), 278 KiB and 83 crates cheaper, and the database stays out of the webview's reach.
# 0.40.2 is the current release on crates.io (verified 2026-09-02).
# `fallible_uint` is what makes `u64` (token counters, envelope `seq`) a `ToSql`/`FromSql`
# type at all in 0.40; without it every u64 needs a hand-written i64 cast.
# `hooks` is what makes `Connection::authorizer` exist. It is needed by one test and only one:
# `a_rung_whose_version_bump_fails_leaves_its_tables_behind_it` has to make a statement fail
# *between* a rung's `execute_batch` and its `user_version` bump, and denying the `PRAGMA
# user_version` write is the only way to fail exactly that statement on demand. The feature is
# `hooks = []` in rusqlite's own manifest — pure Rust, no extra crates, nothing at runtime unless a
# hook is registered (read from the vendored 0.40.2 manifest, 2026-09-04).
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint", "hooks"] }
# see docs/research/persistence.md §4 — `tracing-appender` rotates by time only; size is the
# dimension that matters. 0.8.0 (2025-02-27) is the current release (verified 2026-09-02).
file-rotate = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# `test-util` is not in tokio's `full`, deliberately, and it is what `#[tokio::test(start_paused =
# true)]` needs. One test uses it: the `intent_open` deadline is 5 s, and a paused clock is what
# makes proving it cost microseconds instead of five seconds of every test run.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3.27"
