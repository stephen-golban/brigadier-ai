[package]
name = "brigadier-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
brigadier-core = { path = "../core" }
# see docs/research/persistence.md §2 — rusqlite + `bundled` over sqlx: newest bundled SQLite
# (3.53.2), 278 KiB and 83 crates cheaper, and the database stays out of the webview's reach.
# 0.40.2 is the current release on crates.io (verified 2026-09-02).
# `fallible_uint` is what makes `u64` (token counters, envelope `seq`) a `ToSql`/`FromSql`
# type at all in 0.40; without it every u64 needs a hand-written i64 cast.
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
# see docs/research/persistence.md §4 — `tracing-appender` rotates by time only; size is the
# dimension that matters. 0.8.0 (2025-02-27) is the current release (verified 2026-09-02).
file-rotate = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3.27"
