[package]
name = "brigadier-supervisor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Managed state for N supervised agent sessions, and the flow control between the adapters and the webview."

[lib]
name = "brigadier_supervisor"
path = "src/lib.rs"

[features]
burn = []

[dependencies]
brigadier-core = { path = "../core" }
# Process-group kill for the gate's timeout: `cargo test` spawns children, and killing the pid
# leaves them running. see crates/supervisor/src/verify.rs and docs/research/orphan-sweep.md.
brigadier-proc = { path = "../proc" }
brigadier-store = { path = "../store" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3.27"
