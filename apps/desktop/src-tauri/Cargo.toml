[package]
name = "brigadier-desktop"
description = "Brigadier desktop app: Tauri shell that launches and talks to brigadierd."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "brigadier"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
brigadier-core.workspace = true
brigadier-ipc.workspace = true
brigadier-sandbox.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
# The Browser tab's page: the wry release Tauri itself runs on (a second copy would clash).
wry = { version = "0.55.1", default-features = false }

# The Browser tab's own WebKit UI delegate (src/browser_ui.rs): the releases wry is built on.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSURLRequest"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKFrameInfo", "WKNavigationAction", "WKOpenPanelParameters", "WKSecurityOrigin", "WKUIDelegate", "WKWebView", "WKWebViewConfiguration", "WKWindowFeatures"] }

[lints]
workspace = true
