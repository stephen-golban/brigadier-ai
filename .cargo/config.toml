# whisper.cpp, brigadierd's dictation engine (whisper-rs-sys), built the same everywhere:
# - for any CPU of the target's kind, not just the build machine's (on x86-64 that still means
#   AVX2, FMA and F16C);
# - with the crate's own Rust bindings, so building needs no libclang.
[env]
GGML_NATIVE = "OFF"
WHISPER_DONT_GENERATE_BINDINGS = "1"
