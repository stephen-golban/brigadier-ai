<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brigadier</title>
    <script>
      // brigadier is dark-only (owner decision 2026-09-10). The class is set here as well as in
      // src/main.tsx so it is on <html> before the first contentful paint: `dark:` utilities inside
      // the copied assistant-ui components resolve against it (@custom-variant dark in
      // src/index.css), not against the user's OS preference. Never restore the saved-theme read —
      // it could put `light` here and `dark` on the same element a tick later.
      document.documentElement.classList.add("dark");
      document.documentElement.style.colorScheme = "dark";
    </script>
    <link rel="stylesheet" href="/src/startup.css" />
  </head>
  <body>
    <div id="root">
      <!-- Real startup feedback, replaced by React's matching loading state. FCP is not app-ready. -->
      <div class="startup-loader" role="status" aria-label="Opening Brigadier…">
        <div class="startup-brand" aria-hidden="true">
          <svg class="startup-mark" width="64" height="64" viewBox="0 0 256 256" fill="currentColor">
            <use href="/brand/striped-disc.svg#mark"></use>
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
