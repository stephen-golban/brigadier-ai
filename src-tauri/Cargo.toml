[package]
name = "brigadier"
version = "0.1.0"
description = "Desktop harness for supervising coding-agent CLI sessions"
authors = ["Stephen Golban"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "brigadier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Compiles the fixture-replay load generator into a release-profile binary; debug builds always have it.
burn = ["brigadier-supervisor/burn"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
semver = "1"
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
# The native directory picker behind "Add project". 2.7.3 is the current release
# (crates.io, 2026-09-04); the JS half is `@tauri-apps/plugin-dialog` at the same version.
#
# Registering the plugin here is not enough. `src-tauri/capabilities/default.json` must also carry
# `dialog:allow-open` — that exact identifier, and it is the only one this app needs: `open` is the
# sole import from the plugin anywhere in `src/` (`src/bridge.ts:13`), so `dialog:default` is
# deliberately NOT used. It would additionally grant `save` and `message`, which nothing calls.
#
# The two failure modes are not the same, and the difference is measured, not assumed
# (2026-09-04):
#
#   - A **misspelled** identifier is caught at build time. `tauri-build` resolves every string in
#     `capabilities/*.json` against the plugins in the dependency graph from inside `build.rs`;
#     `dialog:allow-nonsense` fails `cargo check -p brigadier` with **exit 101** and prints the
#     complete set of valid identifiers.
#   - An **omitted** identifier is not caught by anything. The resolver has no way to know what the
#     webview's JavaScript will call, so a capability that simply never mentions
#     `dialog:allow-open` builds clean and rejects the first `open()` at runtime. No test in this
#     repo reaches it; only a click does.
#
# Full working in `docs/research/tauri-dialog.md` §1.
tauri-plugin-dialog = "2"

# The whole harness. None of these know Tauri exists; this crate is the only join.
brigadier-core = { path = "../crates/core" }
brigadier-store = { path = "../crates/store" }
brigadier-supervisor = { path = "../crates/supervisor" }
brigadier-proc = { path = "../crates/proc" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# `env-filter` is what makes `RUST_LOG` work; without it `EnvFilter` is not compiled.
# 0.3.23 is the current release (`cargo search tracing-subscriber`, 2026-09-02).
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
portable-pty = "0.9"
trash = "5"
tempfile = "3.27"
regex = "1"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ignore = "0.4"
globset = "0.4"
uuid = { workspace = true }

# `setrlimit`, safely. This crate is `#![deny(unsafe_code)]`, so `libc::setrlimit` (an unsafe
# extern fn) cannot be called here at all. `nix` 0.31.3 is already in the workspace
# (`crates/proc/Cargo.toml:27`, `crates/core/Cargo.toml:22`) and already in `Cargo.lock`; only the
# `resource` feature is new, and it carries no code beyond `nix::sys::resource`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["resource"] }

[dev-dependencies]
# The reconciler's unit tests build a throwaway `.brigadier/worktrees/` tree on disk; the same
# version every other crate in this workspace already pins.
tempfile = "3.27"
# `test-util` is deliberately not part of tokio's `full`, and it is what
# `#[tokio::test(start_paused = true)]` needs. The keep-awake and conversation-queue loops are
# proved to park — no timer armed over an hour of virtual time — and to renew a 60-second power
# lease at 45 seconds, neither of which can be observed on a real clock. Same line as
# `crates/store/Cargo.toml:35` and `crates/supervisor/Cargo.toml:29`.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
# A completion barrier for Tao's queued NSWindow geometry/style changes.
dispatch2 = "0.3.1"
